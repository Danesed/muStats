name: Site

# Publishes site/ to GitHub Pages, with the icon and the link-preview picture from
# docs/. Scripts/site-shots.sh renders the pictures of the app the page shows.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/icon.png"
      - "docs/screenshots/hero.png"
      - "Scripts/site.sh"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble
        run: Scripts/site.sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
